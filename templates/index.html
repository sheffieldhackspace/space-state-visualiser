<!doctype html>
<html>
  <head>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"
      integrity="sha512-q/dWJ3kcmjBLU4Qc47E4A9kTB4m3wuTY7vkFJDTZKjTs8jhyGQnaUrxa0Ytd0ssMZhbNua9hE+E7Qv1j+DyZwA=="
      crossorigin="anonymous"
    ></script>
    <script type="text/javascript" charset="utf-8">
      colours = {
        "NA": "#444444",
        "door_open": "#990000",
        "light_on": "#806C00",
        "light_off": "#222222",
        "on": "#aa9922",
        "ok": "#454D45"
      }
      function fill(item, colour_or_state) {
        let colour = colour_or_state
        if (colour_or_state == "NA" || colour_or_state == "on" || colour_or_state == "off") {
          colour = colours["NA"]
          if (colour_or_state == "off") {
            if (item.startsWith("floor")) colour = colours["light_off"]
            else colour = colours["ok"]
          }
          else if (colour_or_state == "on") {
            if (item.startsWith("door") || item.startsWith("lock")) colour = colours["door_open"]
            else if (item.startsWith("floor")) colour = colours["light_on"]
            else colour = colours["on"]
          }
        }
        document.getElementById("space").getSVGDocument().querySelector('g[*|label="' + item + '"]').querySelectorAll("*").forEach((e) => {
          if (e.style.fill && e.style.fill != "none") {e.style.fill = colour}
        })
      }
      // update image with ID with state (NA, on, or off)
      function update_image(listener, state) {
        const id = listener["id"];

        console.groupCollapsed(`update <${id}> to <${state}>`);
        console.log(listener);
        console.groupEnd();

        fill(id, state)
      }
      function get_all_objects() {
        return document.getElementById("space").getSVGDocument().querySelectorAll('g[*|label="objects"] > g > g')
      }
      function setAllTo(state) {
        get_all_objects().forEach(e => fill(e.getAttribute("inkscape:label"), state))
      }
      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("space").addEventListener("load", () => {
          // log SVG items
          console.info("SVG loaded!")
          console.log("objects: ", [...get_all_objects()].map(e => e.getAttribute("inkscape:label")))

          // set all items to NA
          console.info("set all items to NA")
          setAllTo("NA")

          console.info("connect to websocket")
          {% if do_socket %}
          const socket = io();
          socket.on("connect", function () {
            console.log("websocket connected!")
            socket.emit("full-status");
          });
          socket.on("status-update", function (data) {
            console.info("got status-update")
            const listener = data[0];
            const new_state = data[1];
            update_image(listener, new_state);
          });
          {% else %}
          console.log("socket turned off")
          {% endif %}
        })
      })
    </script>
    <script>
      // clock
      document.addEventListener("DOMContentLoaded", () => {
        const clock = document.getElementById("clock");
        let interval = setInterval(function () {
          clock.textContent = new Date().toLocaleTimeString("en-GB");
        }, 1000);
      });
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background-color: black;
        z-index: -1001;
        position: relative;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #state {
        position: relative;
        aspect-ratio: 1920/1080;
        width: 100%;
        height: auto;
        max-width: 100%;
        max-height: 100%;
      }
      #state img#space {
        position: absolute;
        aspect-ratio: 1920/1080;
        width: 100%;
        height: auto;
        max-width: 100%;
        max-height: 100%;
      }
      #state img.icon {
        position: absolute;
        height: auto;
        width: auto;
        left: var(--x);
        top: var(--y);
      }
      #space {
        z-index: -1000;
      }
      #clock {
        position: absolute;
        margin: 2rem 7rem;
        top: 0;
        right: 9rem;
        color: white;
        font-size: 4rem;
        font-family: "Courier New", Courier, monospace;
      }
      #statebuttons {
        position: absolute;
        bottom: 0;
        left: 0;
        display: flex;
        gap: 1rem;
        margin: 1rem;
      }
      #statebuttons a,
      #statebuttons a:visited {
        color: black;
        background-color: white;
        border-radius: 1rem;
        padding: 1rem;
        text-decoration: none;
      }
      #statebuttons a.active {
        background-color: darkgreen;
      }
    </style>
  </head>
  <body>
    <div id="state">
      <!-- <img id="space" src="static/space.svg" /> -->
      <object id="space" type="image/svg+xml" data="static/space.svg"></object>
    </div>
    <p id="clock"></p>
    {% if view_state %}
    <div id="statebuttons">
      <button onclick="setAllTo('NA')">NA</button>
      <button onclick="setAllTo('on')">on</button>
      <button onclick="setAllTo('off')">off</button>
    </div>
    {% endif %}
  </body>
</html>
